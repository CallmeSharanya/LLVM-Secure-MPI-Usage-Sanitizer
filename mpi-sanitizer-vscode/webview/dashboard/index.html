<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="{{CSP}}" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MPI Sanitizer Dashboard</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #64748b;
      --border: #dbe3ec;
      --accent: #0f766e;
      --danger: #b42318;
      --warn: #b7791f;
      --soft: #eef6f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.14), transparent 28%),
        radial-gradient(circle at top right, rgba(180, 35, 24, 0.08), transparent 22%),
        linear-gradient(180deg, #fbfcfe 0%, #f3f7fb 100%);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 3;
    }
    header h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
    }
    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #0f766e 58%, #164e63 100%);
      color: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18);
      overflow: hidden;
      position: relative;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: -40px auto auto -30px;
      width: 170px;
      height: 170px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.22), transparent 72%);
      pointer-events: none;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) auto;
      gap: 18px;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .hero-kicker {
      margin: 0 0 4px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
    }
    .hero-title {
      margin: 0;
      font-size: 26px;
      line-height: 1.1;
      font-weight: 800;
    }
    .hero-copy {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.84);
      font-size: 13px;
      line-height: 1.6;
      max-width: 70ch;
    }
    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .hero-stat {
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    .hero-stat-label {
      display: block;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.72);
    }
    .hero-stat-value {
      font-size: 18px;
      font-weight: 780;
      font-variant-numeric: tabular-nums;
    }
    .hero-side {
      display: grid;
      place-items: center;
      min-width: 132px;
    }
    .score-ring {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      padding: 12px;
      background: conic-gradient(var(--accent) 0deg, var(--accent) 0deg, rgba(255, 255, 255, 0.12) 0deg);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.22);
    }
    .score-ring-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(11, 18, 32, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      padding: 10px;
    }
    .score-number {
      font-size: 32px;
      line-height: 1;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }
    .score-label {
      margin-top: 4px;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.66);
    }
    .score-note {
      margin-top: 7px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.4;
    }
    .pill-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: white;
    }
    .pill.ok { background: rgba(18, 114, 93, 0.2); }
    .pill.warn { background: rgba(183, 121, 31, 0.18); }
    .pill.bad { background: rgba(180, 35, 24, 0.18); }
    #root { padding: 16px 20px 24px; }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .tab {
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 7px 11px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--muted);
    }
    .tab.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--soft);
    }
    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }
    .wide-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: minmax(280px, 1.2fr) minmax(280px, 1fr);
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }
    .card h3 {
      margin: 0 0 12px 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: var(--muted);
      font-weight: 700;
    }
    .metric-value {
      font-size: 26px;
      line-height: 1.1;
      font-weight: 720;
      font-variant-numeric: tabular-nums;
    }
    .metric-sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }
    .status-ok { color: var(--accent); }
    .status-warn { color: var(--warn); }
    .status-bad { color: var(--danger); }
    .diag {
      border-left: 3px solid var(--danger);
      padding: 8px 0 8px 10px;
      margin-bottom: 8px;
      background: #fffafa;
    }
    .diag button {
      margin-top: 6px;
      border: 1px solid var(--danger);
      background: white;
      color: var(--danger);
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .muted {
      color: var(--muted);
      font-size: 12px;
    }
    .row {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) minmax(80px, 3fr) 48px;
      gap: 10px;
      align-items: center;
      margin: 8px 0;
      font-size: 13px;
    }
    .bar {
      height: 8px;
      border-radius: 999px;
      background: #e8edf3;
      overflow: hidden;
    }
    .bar span {
      display: block;
      height: 100%;
      background: var(--accent);
    }
    .bar.danger span { background: var(--danger); }
    .table {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 16px;
      font-size: 13px;
    }
    .table div:nth-child(even) {
      font-variant-numeric: tabular-nums;
      font-weight: 650;
    }
    .mini-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin-top: 12px;
    }
    .matrix {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
    }
    .matrix-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      background: linear-gradient(180deg, #ffffff 0%, #f9fbfd 100%);
    }
    .matrix-item strong {
      display: block;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }
    .matrix-item span {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .badge.ok { background: #e8fff8; color: #12725d; border-color: #b7eadc; }
    .badge.warn { background: #fff7e8; color: #9a6400; border-color: #f2d7a0; }
    .badge.bad { background: #fff0f0; color: #b42318; border-color: #f4bcbc; }
    .topology-layout {
      display: grid;
      gap: 12px;
      grid-template-columns: minmax(320px, 1.3fr) minmax(260px, 0.8fr);
      align-items: start;
    }
    .topology-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .topology-header strong {
      font-size: 13px;
    }
    .node-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .node-chip {
      border-radius: 999px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      background: #f7fafc;
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .activity-list {
      display: grid;
      gap: 10px;
      max-height: 420px;
      overflow: auto;
    }
    .activity-item {
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 10px 12px;
      background: linear-gradient(180deg, #ffffff, #fbfdff);
    }
    .activity-item.warn { border-left-color: var(--warn); }
    .activity-item.bad { border-left-color: var(--danger); }
    .activity-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .activity-title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }
    .activity-meta {
      margin-top: 6px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .activity-sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    @media (max-width: 760px) {
      .hero-grid { grid-template-columns: 1fr; }
      .hero-side { justify-items: start; }
      .wide-grid { grid-template-columns: 1fr; }
      .topology-layout { grid-template-columns: 1fr; }
      header { align-items: flex-start; gap: 6px; flex-direction: column; }
      .row { grid-template-columns: 1fr; gap: 5px; }
      .hero-stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>MPI Sanitizer Dashboard</h1>
    <div class="muted" id="status">Waiting for report</div>
  </header>
  <div id="root"></div>

  <script nonce="{{NONCE}}" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script nonce="{{NONCE}}" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script nonce="{{NONCE}}" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <script nonce="{{NONCE}}">
    const vscode = acquireVsCodeApi();

    const Tabs = {
      SUMMARY: "Summary",
      DIAGNOSTICS: "Diagnostics",
      TOPOLOGY: "Topology",
      LATENCY: "Latency",
    };

    const issueKeys = [
      ["type_mismatch", "Type mismatch"],
      ["size_mismatch", "Size mismatch"],
      ["integrity_violation", "Integrity"],
      ["collective_mismatch", "Collective"],
      ["deadlock_detected", "Deadlock"],
      ["replay_detected", "Replay"],
      ["timeout_warning", "Timeout"],
      ["anomaly_warning", "Anomaly"],
      ["overlap_warning", "Overlap"],
    ];

    function n(value) {
      return Number.isFinite(Number(value)) ? Number(value) : 0;
    }

    function fmt(value) {
      return n(value).toLocaleString();
    }

    function latency(value) {
      return value === null || value === undefined ? "N/A" : `${Number(value).toFixed(6)}s`;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function postureScore(summary) {
      let score = 100;
      score -= n(summary.errors_detected) * 12;
      score -= (n(summary.type_mismatch) + n(summary.size_mismatch) + n(summary.integrity_violation)) * 30;
      score -= n(summary.collective_mismatch) * 15;
      score -= n(summary.deadlock_detected) * 100;
      score -= n(summary.replay_detected) * 100;
      score -= n(summary.timeout_warning) * 20;
      score -= n(summary.overlap_warning) * 7;
      score -= n(summary.anomaly_warning) * 5;
      score -= (n(summary.unmatched_sends) + n(summary.unmatched_recvs)) * 10;
      return clamp(Math.round(score), 0, 100);
    }

    function postureLabel(score, summary) {
      if (n(summary.errors_detected) === 0 && n(summary.unmatched_sends) + n(summary.unmatched_recvs) === 0) {
        return "Clean run";
      }
      if (score >= 80) return "Healthy";
      if (score >= 60) return "Degraded";
      return "Critical";
    }

    function postureNote(score, summary) {
      if (n(summary.errors_detected) === 0 && n(summary.unmatched_sends) + n(summary.unmatched_recvs) === 0) {
        return "No protocol violations were counted in the latest run.";
      }
      if (score >= 80) {
        return "Mostly aligned traffic with minor warnings to inspect.";
      }
      if (score >= 60) {
        return "The run contains mismatch signals that deserve a closer look.";
      }
      return "Multiple violations suggest a broken protocol or suspicious traffic pattern.";
    }

    function observedRanks(activity) {
      const ranks = new Set();
      for (const item of activity || []) {
        if (Number.isFinite(Number(item.rank))) {
          ranks.add(Number(item.rank));
        }
        if (Number.isFinite(Number(item.peer))) {
          ranks.add(Number(item.peer));
        }
      }
      return Array.from(ranks).sort((a, b) => a - b);
    }

    function uniqueRanks(activity) {
      const ranks = observedRanks(activity);
      return ranks.length > 0 ? ranks : [0, 1];
    }

    function MissionControl({ summary, activity }) {
      const score = postureScore(summary);
      const ranks = observedRanks(activity);
      const scoreTone = score >= 80 ? "ok" : score >= 60 ? "warn" : "bad";
      const ringColor = scoreTone === "ok" ? "#0f766e" : scoreTone === "warn" ? "#b7791f" : "#b42318";
      const ringStyle = {
        background: `conic-gradient(${ringColor} ${score * 3.6}deg, rgba(255, 255, 255, 0.12) 0deg)`,
      };

      return React.createElement("div", { className: "hero" },
        React.createElement("div", { className: "hero-grid" },
          React.createElement("div", null,
            React.createElement("p", { className: "hero-kicker" }, "MPI usage sanitizer"),
            React.createElement("h2", { className: "hero-title" }, "Mission Control for message correctness"),
            React.createElement("p", { className: "hero-copy" },
              "This dashboard fuses runtime communication evidence, protocol mismatch signals, and trust-oriented analytics into a single view you can walk through live during a demo."
            ),
            React.createElement("div", { className: "hero-stats" },
              React.createElement("div", { className: "hero-stat" },
                React.createElement("span", { className: "hero-stat-label" }, "Total events"),
                React.createElement("div", { className: "hero-stat-value" }, fmt(summary.total_events))
              ),
              React.createElement("div", { className: "hero-stat" },
                React.createElement("span", { className: "hero-stat-label" }, "Observed ranks"),
                React.createElement("div", { className: "hero-stat-value" }, fmt(ranks.length))
              ),
              React.createElement("div", { className: "hero-stat" },
                React.createElement("span", { className: "hero-stat-label" }, "Matched pairs"),
                React.createElement("div", { className: "hero-stat-value" }, fmt(summary.matched_pairs))
              )
            ),
            React.createElement("div", { className: "pill-row" },
              React.createElement("span", { className: `pill ${scoreTone}` }, `posture ${postureLabel(score, summary)}`),
              React.createElement("span", { className: "pill" }, `${fmt(summary.sends)} sends`),
              React.createElement("span", { className: "pill" }, `${fmt(summary.recvs)} recvs`)
            )
          ),
          React.createElement("div", { className: "hero-side" },
            React.createElement("div", { className: "score-ring", style: ringStyle },
              React.createElement("div", { className: "score-ring-inner" },
                React.createElement("div", null,
                  React.createElement("div", { className: "score-number" }, score),
                  React.createElement("div", { className: "score-label" }, "security score"),
                  React.createElement("div", { className: "score-note" }, postureNote(score, summary))
                )
              )
            )
          )
        )
      );
    }

    function OverviewTiles({ summary, activity }) {
      const ranks = observedRanks(activity);
      return React.createElement("div", { className: "mini-grid" },
        React.createElement("div", { className: "card" },
          React.createElement("h3", null, "Trust Snapshot"),
          React.createElement("div", { className: "matrix" },
            React.createElement("div", { className: "matrix-item" }, React.createElement("span", null, "Integrity"), React.createElement("strong", null, fmt(summary.integrity_violation))),
            React.createElement("div", { className: "matrix-item" }, React.createElement("span", null, "Replay"), React.createElement("strong", null, fmt(summary.replay_detected))),
            React.createElement("div", { className: "matrix-item" }, React.createElement("span", null, "Timeout"), React.createElement("strong", null, fmt(summary.timeout_warning))),
            React.createElement("div", { className: "matrix-item" }, React.createElement("span", null, "Deadlock"), React.createElement("strong", null, fmt(summary.deadlock_detected)))
          )
        ),
        React.createElement("div", { className: "card" },
          React.createElement("h3", null, "Observed Ranks"),
          React.createElement("div", { className: "muted" }, ranks.length ? "Endpoints inferred from the latest run" : "No explicit rank data recorded yet."),
          React.createElement("div", { className: "node-list" },
            (ranks.length ? ranks : [0, 1]).map((rank) => React.createElement("span", { className: "node-chip", key: rank }, `rank ${rank}`))
          )
        )
      );
    }

    function MetricCard({ title, value, sub, tone }) {
      return React.createElement("div", { className: "card" },
        React.createElement("h3", null, title),
        React.createElement("div", { className: `metric-value ${tone || ""}` }, value),
        sub ? React.createElement("div", { className: "metric-sub" }, sub) : null
      );
    }

    function Breakdown({ summary }) {
      const max = Math.max(1, ...issueKeys.map(([key]) => n(summary[key])));
      return React.createElement("div", { className: "card" },
        React.createElement("h3", null, "Issue Breakdown"),
        issueKeys.map(([key, label]) => {
          const value = n(summary[key]);
          const pct = Math.max(2, Math.round((value / max) * 100));
          return React.createElement("div", { className: "row", key },
            React.createElement("div", null, label),
            React.createElement("div", { className: `bar ${value > 0 ? "danger" : ""}` },
              React.createElement("span", { style: { width: `${pct}%` } })
            ),
            React.createElement("div", null, fmt(value))
          );
        })
      );
    }

    function SummaryView({ summary, activity }) {
      const errors = n(summary.errors_detected);
      return React.createElement("div", null,
        React.createElement("div", { className: "grid" },
          React.createElement(MetricCard, {
            title: "Errors",
            value: fmt(errors),
            sub: errors === 0 ? "No runtime issues counted" : "Runtime issues counted",
            tone: errors === 0 ? "status-ok" : "status-bad",
          }),
          React.createElement(MetricCard, {
            title: "Events",
            value: fmt(summary.total_events),
            sub: `${fmt(summary.sends)} sends, ${fmt(summary.recvs)} recvs`,
          }),
          React.createElement(MetricCard, {
            title: "Matched Pairs",
            value: fmt(summary.matched_pairs),
            sub: `${fmt(summary.unmatched_sends)} unmatched sends, ${fmt(summary.unmatched_recvs)} unmatched recvs`,
            tone: n(summary.unmatched_sends) + n(summary.unmatched_recvs) > 0 ? "status-warn" : "status-ok",
          }),
          React.createElement(MetricCard, {
            title: "Avg P2P Latency",
            value: latency(summary.avg_p2p_latency),
            sub: "Measured from matched send/recv timestamps",
          })
        ),
        React.createElement("div", { style: { height: 12 } }),
        React.createElement("div", { className: "wide-grid" },
          React.createElement(Breakdown, { summary }),
          React.createElement(CommunicationCard, { summary })
        ),
        React.createElement(OverviewTiles, { summary, activity })
      );
    }

    function CommunicationCard({ summary }) {
      return React.createElement("div", { className: "card" },
        React.createElement("h3", null, "Communication"),
        React.createElement("div", { className: "table" },
          React.createElement("div", null, "Sends"), React.createElement("div", null, fmt(summary.sends)),
          React.createElement("div", null, "Recvs"), React.createElement("div", null, fmt(summary.recvs)),
          React.createElement("div", null, "Collectives"), React.createElement("div", null, fmt(summary.collectives)),
          React.createElement("div", null, "Matched pairs"), React.createElement("div", null, fmt(summary.matched_pairs)),
          React.createElement("div", null, "Graph file"), React.createElement("div", null, summary.comm_graph || "N/A")
        )
      );
    }

    function DiagnosticsView({ errors }) {
      return React.createElement("div", { className: "card" },
        React.createElement("h3", null, "Diagnostics"),
        errors.length === 0
          ? React.createElement("div", { className: "muted" }, "No source diagnostics recorded.")
          : errors.map((e, idx) => React.createElement("div", { key: idx, className: "diag" },
              React.createElement("div", null, `[rank ${e.rank ?? "?"}] ${e.message}`),
              React.createElement("div", { className: "muted" }, `${e.file}:${e.line}`),
              e.file && e.line ? React.createElement("button", {
                onClick: () => vscode.postMessage({ type: "navigateTo", file: e.file, line: e.line })
              }, "Go to source") : null
            ))
      );
    }

    function App() {
      const [activeTab, setActiveTab] = React.useState(Tabs.SUMMARY);
      const [report, setReport] = React.useState({ errors: [], summary: {}, activity: [] });

      React.useEffect(() => {
        const listener = (event) => {
          if (event.data?.type === "report") {
            const nextReport = event.data.report || { errors: [], summary: {}, activity: [] };
            setReport(nextReport);
            const status = document.getElementById("status");
            if (status) {
              const total = n(nextReport.summary?.total_events);
              const score = postureScore(nextReport.summary || {});
              status.textContent = total > 0 ? `${fmt(total)} events analyzed · posture ${score}/100` : "Report loaded";
            }
          }
        };
        window.addEventListener("message", listener);
        return () => window.removeEventListener("message", listener);
      }, []);

      const summary = report.summary || {};
      const errors = report.errors || [];
      const activity = report.activity || [];
      const hasSummary = Object.keys(summary).length > 0;

      if (!hasSummary) {
        return React.createElement("div", { className: "card" },
          React.createElement("h3", null, "Summary"),
          React.createElement("div", { className: "muted" }, "No metrics available yet.")
        );
      }

      let body;
      if (activeTab === Tabs.SUMMARY) {
        body = React.createElement(SummaryView, { summary, activity });
      } else if (activeTab === Tabs.DIAGNOSTICS) {
        body = React.createElement(DiagnosticsView, { errors });
      } else if (activeTab === Tabs.TOPOLOGY) {
        body = React.createElement("div", { className: "topology-layout" },
          React.createElement(NetworkView, { summary, activity }),
          React.createElement(ActivityView, { activity })
        );
      } else {
        body = React.createElement("div", { className: "grid" },
          React.createElement(MetricCard, {
            title: "Avg P2P Latency",
            value: latency(summary.avg_p2p_latency),
            sub: `${fmt(summary.matched_pairs)} matched pairs`,
          }),
          React.createElement(MetricCard, {
            title: "Timeout Warnings",
            value: fmt(summary.timeout_warning),
            sub: `${fmt(summary.deadlock_detected)} deadlocks detected`,
            tone: n(summary.timeout_warning) + n(summary.deadlock_detected) > 0 ? "status-bad" : "status-ok",
          })
        );
      }

      return React.createElement("div", null,
        React.createElement(MissionControl, { summary, activity }),
        React.createElement("div", { className: "tabs" },
          Object.values(Tabs).map((tab) =>
            React.createElement("button", {
              key: tab,
              className: `tab ${activeTab === tab ? "active" : ""}`,
              onClick: () => setActiveTab(tab),
            }, tab)
          )
        ),
        body
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));

    function activityTone(activityItem) {
      if (activityItem.integrity === "flagged" || activityItem.auth === "unverified") {
        return "bad";
      }
      if (activityItem.severity === "warning") {
        return "warn";
      }
      return "ok";
    }

    function badgeText(activityItem) {
      const bits = [];
      if (activityItem.direction) bits.push(activityItem.direction);
      if (activityItem.integrity) bits.push(activityItem.integrity === "flagged" ? "integrity-failed" : "integrity-ok");
      if (activityItem.auth) bits.push(activityItem.auth === "unverified" ? "auth-check" : "auth-ok");
      return bits.join(" · ");
    }

    function ActivityView({ activity }) {
      return React.createElement("div", { className: "card" },
        React.createElement("h3", null, "Live Activity"),
        activity.length === 0
          ? React.createElement("div", { className: "muted" }, "No live message events were present in the latest report.")
          : React.createElement("div", { className: "activity-list" },
              activity.slice(0, 8).map((item) =>
                React.createElement("div", { key: item.id, className: `activity-item ${activityTone(item)}` },
                  React.createElement("div", { className: "activity-top" },
                    React.createElement("div", null,
                      React.createElement("div", { className: "activity-title" }, item.label),
                      React.createElement("div", { className: "activity-meta" },
                        React.createElement("span", { className: `badge ${activityTone(item)}` }, item.kind),
                        item.rank !== undefined ? React.createElement("span", { className: "badge ok" }, `rank ${item.rank}`) : null,
                        item.peer !== undefined ? React.createElement("span", { className: "badge ok" }, `peer ${item.peer}`) : null,
                        item.severity ? React.createElement("span", { className: `badge ${item.severity === "error" ? "bad" : item.severity === "warning" ? "warn" : "ok"}` }, item.severity) : null
                      )
                    ),
                    React.createElement("div", { className: "muted" }, badgeText(item))
                  ),
                  React.createElement("div", { className: "activity-sub" },
                    item.file && item.line ? `${item.file}:${item.line}` : "Derived from the latest report entry"
                  )
                )
              )
            )
      );
    }

    function NetworkView({ summary, activity }) {
      const containerRef = React.useRef(null);
      const networkRef = React.useRef(null);
      const seenRef = React.useRef(new Set());

      React.useEffect(() => {
        const container = containerRef.current;
        if (!container) return;

        if (networkRef.current) {
          networkRef.current.destroy();
          networkRef.current = null;
        }

        const ranks = uniqueRanks(activity);
        const degree = new Map();
        for (const item of activity || []) {
          const src = Number.isFinite(Number(item.rank)) ? Number(item.rank) : null;
          const dst = Number.isFinite(Number(item.peer)) ? Number(item.peer) : null;
          if (src !== null) {
            degree.set(src, (degree.get(src) || 0) + 1);
          }
          if (dst !== null) {
            degree.set(dst, (degree.get(dst) || 0) + 1);
          }
        }

        const nodes = new vis.DataSet(ranks.map((rank, index) => ({
          id: rank,
          label: `Rank ${rank}`,
          title: `Observed endpoint ${rank}`,
          shape: 'dot',
          size: 18 + Math.min(10, (degree.get(rank) || 0) * 2),
          color: {
            background: index % 2 === 0 ? '#e6fffb' : '#eef6ff',
            border: index % 2 === 0 ? '#0f766e' : '#1d4ed8',
          }
        })));
        const edges = new vis.DataSet([]);
        const data = { nodes, edges };
        const options = {
          edges: { smooth: { type: 'dynamic' }, arrows: { to: { enabled: true, scaleFactor: 0.6 } } },
          physics: { enabled: false },
          interaction: { hover: true, zoomView: false }
        };
        networkRef.current = new vis.Network(container, data, options);

        function animateMessage(eventItem) {
          const id = `m-${eventItem.id}`;
          const src = Number.isFinite(Number(eventItem.rank)) ? Number(eventItem.rank) : 0;
          const dst = Number.isFinite(Number(eventItem.peer)) ? Number(eventItem.peer) : (src === 0 ? 1 : 0);
          const color = eventItem.integrity === 'flagged' || eventItem.auth === 'unverified' ? '#b42318' : '#0f766e';
          if (!nodes.get(src)) {
            nodes.add({ id: src, label: `Rank ${src}`, shape: 'dot', size: 18, color: { background: '#eef6ff', border: '#1d4ed8' } });
          }
          if (!nodes.get(dst)) {
            nodes.add({ id: dst, label: `Rank ${dst}`, shape: 'dot', size: 18, color: { background: '#eef6ff', border: '#1d4ed8' } });
          }
          edges.add({
            id,
            from: eventItem.direction === 'recv' ? dst : src,
            to: eventItem.direction === 'recv' ? src : dst,
            label: eventItem.kind,
            color: { color },
            width: 3
          });
          setTimeout(() => edges.remove(id), 900);
        }

        for (const item of activity || []) {
          if (seenRef.current.has(item.id)) {
            continue;
          }
          seenRef.current.add(item.id);
          animateMessage(item);
        }

        return () => {};
      }, [activity]);

      return React.createElement('div', { style: { display: 'grid', gap: 12 } },
        React.createElement('div', { className: 'card' },
          React.createElement('div', { className: 'topology-header' },
            React.createElement('strong', null, 'Topology Visualizer'),
            React.createElement('div', { className: 'muted' }, `${uniqueRanks(activity).length} observed ranks · ${fmt(summary.sends)} sends · ${fmt(summary.recvs)} recvs`)
          ),
          React.createElement('div', { ref: containerRef, style: { height: 280 } })
        ),
        React.createElement('div', { className: 'card' },
          React.createElement('h3', null, 'Security Signals'),
          React.createElement('div', { className: 'table' },
            React.createElement('div', null, 'Sends'), React.createElement('div', null, fmt(summary.sends)),
            React.createElement('div', null, 'Recvs'), React.createElement('div', null, fmt(summary.recvs)),
            React.createElement('div', null, 'Integrity'), React.createElement('div', null, fmt(summary.integrity_violation)),
            React.createElement('div', null, 'Replay'), React.createElement('div', null, fmt(summary.replay_detected)),
            React.createElement('div', null, 'Warnings'), React.createElement('div', null, fmt(n(summary.timeout_warning) + n(summary.anomaly_warning) + n(summary.overlap_warning)))
          ),
          React.createElement('div', { className: 'node-list' },
            uniqueRanks(activity).map((rank) => React.createElement('span', { className: 'node-chip', key: rank }, `rank ${rank}`))
          )
        )
      );
    }
  </script>
</body>
</html>
